<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master Data Alatan — Admin SIM Makmal</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              primary: '#1B4D3E',
              'primary-hover': '#246350',
              'primary-dark': '#103227',
              mint: '#4EAE85',
              'mint-light': '#68C49D',
              'mint-subtle': '#EAF4F0',
            }
          },
          boxShadow: {
            'subtle-card': '0 1px 3px rgba(0, 0, 0, 0.02), 0 4px 14px rgba(0, 0, 0, 0.03)',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-white font-sans text-gray-900 h-screen w-full overflow-hidden antialiased">

  <div class="w-full h-full bg-white overflow-hidden flex flex-col lg:flex-row">

    <!-- Mobile Header -->
    <div class="lg:hidden flex items-center justify-between px-6 py-4 border-b border-gray-100 bg-white">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-full bg-brand-primary flex items-center justify-center text-brand-mint">
          <i data-lucide="boxes" class="w-5 h-5"></i>
        </div>
        <span class="font-extrabold text-xl tracking-tight text-gray-900">SIM Makmal</span>
      </div>
      <button id="mobile-menu-btn" class="p-2 rounded-full border border-gray-200 text-gray-700">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>
    </div>

    <div id="mobile-overlay" class="fixed inset-0 z-40 bg-black/40 hidden lg:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar" data-active="master-barang"></aside>
    <script src="sidebar.js"></script>

    <!-- Right Workspace -->
    <div class="flex-1 flex flex-col bg-[#F6F7F9] min-w-0 overflow-y-auto">

      <!-- Header -->
      <header class="px-6 lg:px-8 py-4 bg-[#F6F7F9] flex flex-col sm:flex-row items-center justify-between gap-4 border-b border-gray-200/60 sticky top-0 z-30 backdrop-blur-md bg-opacity-95">
        <div>
          <h1 class="text-xl font-extrabold tracking-tight text-gray-900">Master Data Alatan & Kategori Makmal</h1>
          <p class="text-xs text-gray-500 font-medium">Tambah alatan baharu, selaras stok inventori, dan tetapkan lokasi rak penyimpanan</p>
        </div>

        <button onclick="openAddModal()" class="px-4 py-2 bg-brand-primary hover:bg-brand-primary-hover active:scale-95 text-white font-semibold text-xs rounded-full flex items-center gap-1.5 shadow-sm transition-all">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          <span>Tambah Alatan Baharu</span>
        </button>
      </header>

      <!-- Main Content -->
      <main class="p-6 lg:p-8 space-y-6">

        <!-- Filter & Search Bar -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-gray-100 shadow-subtle-card">
          <div class="flex items-center gap-2 w-full sm:w-auto">
            <span class="text-xs font-bold text-gray-500">Kategori:</span>
            <select id="filter-cat" onchange="renderInventoryTable()" class="px-3 py-1.5 bg-gray-50 rounded-xl border border-gray-200 text-xs font-semibold text-gray-700 focus:outline-none focus:ring-2 focus:ring-brand-primary">
              <option value="ALL">Semua Bidang (Semua)</option>
              <option value="Kimia">Makmal Kimia</option>
              <option value="Biologi">Makmal Biologi</option>
              <option value="Fizik">Makmal Fizik</option>
              <option value="Umum">Umum / Radas Asas</option>
            </select>
          </div>

          <div class="relative w-full sm:w-72">
            <i data-lucide="search" class="w-4 h-4 text-gray-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input id="search-box" type="text" placeholder="Cari kod, nama, atau rak..." oninput="handleSearch(this.value)"
              class="w-full pl-10 pr-4 py-2 bg-gray-50 rounded-full border border-gray-200 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-primary transition-all">
          </div>
        </div>

        <!-- Inventory Master Table -->
        <div class="bg-white rounded-2xl border border-gray-100 shadow-subtle-card overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-gray-50/80 border-b border-gray-100 text-gray-400 font-bold uppercase tracking-wider text-[10px]">
                <tr>
                  <th class="py-3.5 px-5">Kod & Nama Alatan</th>
                  <th class="py-3.5 px-5">Kategori</th>
                  <th class="py-3.5 px-5">Lokasi Rak</th>
                  <th class="py-3.5 px-5 text-center">Jumlah Stok</th>
                  <th class="py-3.5 px-5 text-center">Tersedia</th>
                  <th class="py-3.5 px-5 text-center">Dipinjam</th>
                  <th class="py-3.5 px-5 text-center">Rosak</th>
                  <th class="py-3.5 px-5 text-right">Tindakan</th>
                </tr>
              </thead>
              <tbody id="inventory-tbody" class="divide-y divide-gray-100">
                <!-- Rendered via JS -->
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- MODAL TAMBAH / EDIT ALATAN -->
  <div id="item-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white rounded-3xl shadow-2xl border border-gray-200 max-w-lg w-full p-6 sm:p-8 space-y-5 relative">
      <div class="flex items-center justify-between border-b border-gray-100 pb-3">
        <h3 class="text-base font-extrabold text-gray-900" id="modal-title">Tambah Alatan Baharu</h3>
        <button onclick="closeItemModal()" class="p-1.5 rounded-full text-gray-400 hover:text-gray-700">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <form id="item-form" onsubmit="handleItemFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="edit-item-id">

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Kod Alatan *</label>
            <input id="item-code" type="text" required placeholder="Cth: INV-KIM-005" class="w-full px-3 py-2 bg-gray-50 rounded-xl border border-gray-200 text-xs font-mono uppercase focus:bg-white focus:ring-2 focus:ring-brand-primary">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Kategori *</label>
            <select id="item-category" required class="w-full px-3 py-2 bg-gray-50 rounded-xl border border-gray-200 text-xs font-semibold focus:bg-white focus:ring-2 focus:ring-brand-primary">
              <option value="Kimia">Kimia</option>
              <option value="Biologi">Biologi</option>
              <option value="Fizik">Fizik</option>
              <option value="Umum">Umum</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Nama Alatan Makmal *</label>
          <input id="item-name" type="text" required placeholder="Cth: Kelalang Kon 250ml" class="w-full px-3 py-2 bg-gray-50 rounded-xl border border-gray-200 text-xs focus:bg-white focus:ring-2 focus:ring-brand-primary">
        </div>

        <div class="grid grid-cols-3 gap-3">
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Lokasi Rak/Almari *</label>
            <input id="item-location" type="text" required placeholder="Cth: Rak K-02" class="w-full px-3 py-2 bg-gray-50 rounded-xl border border-gray-200 text-xs focus:bg-white focus:ring-2 focus:ring-brand-primary">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Jumlah Kuantiti *</label>
            <input id="item-qty" type="number" min="1" required value="10" class="w-full px-3 py-2 bg-gray-50 rounded-xl border border-gray-200 text-xs font-mono text-center focus:bg-white focus:ring-2 focus:ring-brand-primary">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-700 mb-1">Unit *</label>
            <input id="item-unit" type="text" required value="Unit" placeholder="Unit / Set / Rak" class="w-full px-3 py-2 bg-gray-50 rounded-xl border border-gray-200 text-xs text-center focus:bg-white focus:ring-2 focus:ring-brand-primary">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Spesifikasi / Catatan Alatan</label>
          <input id="item-specs" type="text" placeholder="Cth: Kaca borosilikat tahan haba, graduasi putih" class="w-full px-3 py-2 bg-gray-50 rounded-xl border border-gray-200 text-xs focus:bg-white focus:ring-2 focus:ring-brand-primary">
        </div>

        <div class="pt-3 border-t border-gray-100 flex items-center justify-end gap-2">
          <button type="button" onclick="closeItemModal()" class="px-4 py-2 text-xs font-semibold text-gray-600 hover:bg-gray-100 rounded-xl">Batal</button>
          <button type="submit" class="px-5 py-2 bg-brand-primary hover:bg-brand-primary-hover active:scale-95 text-white text-xs font-bold rounded-xl shadow-xs">Simpan Data Alatan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../store.js"></script>

  <script>
    let currentSearch = '';

    function refreshIcons() {
      if (window.lucide && typeof window.lucide.createIcons === 'function') {
        window.lucide.createIcons();
      }
    }

    // Toggle Mobile
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileCloseBtn = document.getElementById('mobile-close-btn');
    const mobileOverlay = document.getElementById('mobile-overlay');
    const sidebar = document.getElementById('sidebar');

    function toggleMobile() {
      sidebar.classList.toggle('-translate-x-full');
      mobileOverlay.classList.toggle('hidden');
    }
    if (mobileMenuBtn) mobileMenuBtn.addEventListener('click', toggleMobile);
    if (mobileCloseBtn) mobileCloseBtn.addEventListener('click', toggleMobile);
    if (mobileOverlay) mobileOverlay.addEventListener('click', toggleMobile);

    function handleSearch(q) {
      currentSearch = q.toLowerCase().trim();
      renderInventoryTable();
    }

    function renderInventoryTable() {
      const tbody = document.getElementById('inventory-tbody');
      tbody.innerHTML = '';

      const filterCat = document.getElementById('filter-cat').value;
      let items = MakmalStore.getInventory();
      const metrics = MakmalStore.getMetrics();

      document.getElementById('sidebar-officer-count').textContent = metrics.totalOfficers;
      document.getElementById('badge-active-loans').textContent = metrics.activeLoansCount;
      const overdueSide = document.getElementById('badge-overdue-loans');
      if (metrics.overdueLoansCount > 0) {
        overdueSide.textContent = metrics.overdueLoansCount + ' lewat';
        overdueSide.classList.remove('hidden');
      } else {
        overdueSide.classList.add('hidden');
      }

      if (filterCat !== 'ALL') {
        items = items.filter(i => i.category === filterCat);
      }

      if (currentSearch) {
        items = items.filter(i => 
          i.id.toLowerCase().includes(currentSearch) ||
          i.name.toLowerCase().includes(currentSearch) ||
          i.location.toLowerCase().includes(currentSearch)
        );
      }

      items.forEach(item => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-gray-50/70 transition-colors';
        tr.innerHTML = `
          <td class="py-3.5 px-5">
            <div class="font-bold text-gray-900">${item.name}</div>
            <div class="font-mono text-[10px] text-gray-400">${item.id} • ${item.unit || 'Unit'}</div>
          </td>
          <td class="py-3.5 px-5">
            <span class="px-2.5 py-0.5 bg-gray-100 text-gray-700 rounded-full font-bold text-[10px]">${item.category}</span>
          </td>
          <td class="py-3.5 px-5 font-medium text-gray-700">${item.location}</td>
          <td class="py-3.5 px-5 text-center font-mono font-bold text-gray-900">${item.totalQty}</td>
          <td class="py-3.5 px-5 text-center font-mono font-bold text-emerald-700">${item.availableQty}</td>
          <td class="py-3.5 px-5 text-center font-mono font-bold text-brand-primary">${item.borrowedQty || 0}</td>
          <td class="py-3.5 px-5 text-center font-mono font-bold ${item.damagedQty > 0 ? 'text-rose-600' : 'text-gray-400'}">${item.damagedQty || 0}</td>
          <td class="py-3.5 px-5 text-right space-x-1">
            <button onclick="openEditModal('${item.id}')" class="p-1.5 text-gray-500 hover:text-brand-primary hover:bg-gray-100 rounded-lg transition-all" title="Edit Alatan">
              <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="promptStockAdjust('${item.id}')" class="p-1.5 text-gray-500 hover:text-emerald-700 hover:bg-emerald-50 rounded-lg transition-all" title="Pelarasan Stok">
              <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
            </button>
            <button onclick="confirmDeleteItem('${item.id}')" class="p-1.5 text-gray-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition-all" title="Padam Alatan">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      refreshIcons();
    }

    // Modal Add / Edit
    function openAddModal() {
      document.getElementById('modal-title').textContent = 'Tambah Alatan Baharu';
      document.getElementById('edit-item-id').value = '';
      document.getElementById('item-form').reset();
      document.getElementById('item-code').readOnly = false;
      document.getElementById('item-modal').classList.remove('hidden');
      refreshIcons();
    }

    function openEditModal(id) {
      const item = MakmalStore.getItemById(id);
      if (!item) return;

      document.getElementById('modal-title').textContent = 'Kemas Kini Maklumat Alatan';
      document.getElementById('edit-item-id').value = item.id;
      document.getElementById('item-code').value = item.id;
      document.getElementById('item-code').readOnly = true;
      document.getElementById('item-category').value = item.category;
      document.getElementById('item-name').value = item.name;
      document.getElementById('item-location').value = item.location;
      document.getElementById('item-qty').value = item.totalQty;
      document.getElementById('item-unit').value = item.unit || 'Unit';
      document.getElementById('item-specs').value = item.specs || '';
      document.getElementById('item-modal').classList.remove('hidden');
      refreshIcons();
    }

    function closeItemModal() {
      document.getElementById('item-modal').classList.add('hidden');
    }

    function handleItemFormSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('edit-item-id').value;
      const code = document.getElementById('item-code').value.trim();
      const category = document.getElementById('item-category').value;
      const name = document.getElementById('item-name').value.trim();
      const location = document.getElementById('item-location').value.trim();
      const qty = parseInt(document.getElementById('item-qty').value, 10);
      const unit = document.getElementById('item-unit').value.trim();
      const specs = document.getElementById('item-specs').value.trim();

      try {
        if (editId) {
          MakmalStore.updateInventoryItem(editId, {
            category,
            name,
            location,
            totalQty: qty,
            unit,
            specs
          });
          MakmalStore.showToast('Maklumat alatan berjaya dikemaskini!', 'success');
        } else {
          MakmalStore.addInventoryItem({
            id: code,
            name,
            category,
            location,
            totalQty: qty,
            unit,
            specs
          });
          MakmalStore.showToast(`Alatan ${code} berjaya didaftarkan ke inventori!`, 'success');
        }
        closeItemModal();
        renderInventoryTable();
      } catch (err) {
        MakmalStore.showToast(err.message, 'error');
      }
    }

    function promptStockAdjust(id) {
      const item = MakmalStore.getItemById(id);
      if (!item) return;

      const newQtyStr = prompt(`Pelarasan Stok untuk "${item.name}"\nJumlah stok semasa: ${item.totalQty}\nMasukkan jumlah stok baharu:`, item.totalQty);
      if (newQtyStr === null) return;

      const newQty = parseInt(newQtyStr, 10);
      if (isNaN(newQty) || newQty < 0) {
        MakmalStore.showToast('Sila masukkan nilai nombor yang sah.', 'error');
        return;
      }

      try {
        MakmalStore.updateInventoryItem(id, { totalQty: newQty });
        MakmalStore.showToast(`Stok ${item.name} diselaraskan kepada ${newQty} unit.`, 'success');
        renderInventoryTable();
      } catch (err) {
        MakmalStore.showToast(err.message, 'error');
      }
    }

    function confirmDeleteItem(id) {
      const item = MakmalStore.getItemById(id);
      if (!item) return;

      if (confirm(`Adakah anda pasti mahu memadam alatan "${item.name}" (${item.id})?`)) {
        try {
          MakmalStore.deleteInventoryItem(id);
          MakmalStore.showToast('Alatan berjaya dipadam daripada inventori.', 'success');
          renderInventoryTable();
        } catch (err) {
          MakmalStore.showToast(err.message, 'error');
        }
      }
    }

    window.addEventListener('DOMContentLoaded', renderInventoryTable);
    window.addEventListener('sim_makmal_sync', renderInventoryTable);
  </script>
</body>
</html>
